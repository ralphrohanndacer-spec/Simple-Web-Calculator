<!doctype html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="calculator">
      <input id="display" readonly />
      <div id="keys">
        <button id="clear-btn" onclick="">AC</button>
        <button id="delete-btn" onclick="">X</button>
        <button id="btn7" onclick="">7</button>
        <button id="btn8" onclick="">8</button>
        <button id="btn9" onclick="">9</button>
        <button id="btn4" onclick="">4</button>
        <button id="btn5" onclick="">5</button>
        <button id="btn6" onclick="">6</button>
        <button id="btn1" onclick="">1</button>
        <button id="btn2" onclick="">2</button>
        <button id="btn3" onclick="">3</button>
        <button id="btn0" onclick="">0</button>
        <button id="btn-dot" onclick="">.</button>
        <button id="plus-btn" onclick="">+</button>
        <button id="subtract-btn" onclick="">-</button>
        <button id="multiply-btn" onclick="">*</button>
        <button id="divide-btn" onclick="">/</button>
        <button id="eval-btn" onclick="">=</button>
      </div>
    </div>
  </body>
</html>
